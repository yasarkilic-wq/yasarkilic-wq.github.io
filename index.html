<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173957">
<title>Story4Kids Admin</title>
<style>
:root{
  --navy:#173957;--navy2:#285978;--cream:#fff9ef;--paper:#fff;--ink:#203342;--muted:#6f7881;
  --line:#e5dac8;--ok:#17775a;--warn:#a06b16;--danger:#a64e4e;--blue:#367c9e;--soft:#f2f5f7;
  --shadow:0 10px 28px rgba(29,52,70,.08);
}
*{box-sizing:border-box}
html{background:#e9edf0}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e9edf0}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:520px;min-height:100vh;margin:0 auto;background:var(--cream);box-shadow:0 0 35px #0002}
header{position:sticky;top:0;z-index:30;background:rgba(23,57,87,.96);backdrop-filter:blur(18px);color:#fff;padding:13px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{height:42px;width:42px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:950;font-size:12px}
.brand strong{display:block;font-size:17px}.brand small{opacity:.72;font-size:10px}
.head-actions{margin-left:auto;display:flex;gap:7px}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid #ffffff30;background:#ffffff12;color:white}
main{padding:14px 13px 90px}
h1{font-size:28px;line-height:1.07;color:var(--navy);margin:7px 0 9px}
h2{font-size:21px;line-height:1.15;color:var(--navy);margin:5px 0 10px}
h3{font-size:15px;margin:0 0 5px}
p{line-height:1.42}
.small{font-size:12px;color:var(--muted)}
.mini{font-size:10px;color:var(--muted)}
.section-title{margin:18px 3px 8px;text-transform:uppercase;letter-spacing:.09em;font-size:10px;font-weight:900;color:#857a70}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(145deg,#fffdf9,#f5e8d4);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;border-radius:999px;background:#edf1f4;padding:5px 8px;font-size:10px;font-weight:850}
.pill.ok{background:#e5f4ed;color:var(--ok)}.pill.warn{background:#fff0d4;color:#87580d}.pill.blue{background:#e5f1f7;color:#296e90}.pill.red{background:#fbe9e9;color:#924848}
.btn{width:100%;border:0;border-radius:13px;padding:13px 12px;background:var(--navy);color:white;font-weight:850;margin-top:8px}
.btn.secondary{background:#fff;color:var(--navy);border:1.2px solid var(--navy)}
.btn.soft{background:#edf2f5;color:var(--navy)}
.btn.ok{background:var(--ok)}
.btn.warn{background:#fff1d9;color:#80520b;border:1px solid #e3c383}
.btn.danger{background:#fff0f0;color:#8e4242;border:1px solid #e1bcbc}
.btn:disabled{opacity:.52;cursor:default}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.actions .btn{margin:0}
input,textarea{width:100%;border:1px solid #d9d2c8;background:white;border-radius:12px;padding:12px 11px;color:var(--ink);outline:none}
input:focus,textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px #17395715}
label{display:block;font-size:11px;font-weight:850;color:#536574;margin:12px 2px 5px}
textarea{min-height:85px;resize:vertical}
.metric{font-size:28px;font-weight:950;color:var(--navy)}
.progress{height:8px;background:#ece4d7;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--navy)}
.story{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px}
.story-head{display:flex;gap:9px;align-items:flex-start}
.num{width:29px;height:29px;flex:0 0 29px;border-radius:9px;background:#edf2f5;display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--navy)}
.story-title{font-size:13px;font-weight:850;line-height:1.25}
.desc{font-size:11px;color:var(--muted);line-height:1.4;margin-top:3px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:7px 8px;font-size:12px}.kv b{color:#697681}
.rule{background:#f2f6f8;border-left:4px solid var(--navy);border-radius:0 11px 11px 0;padding:9px 10px;margin:7px 0;font-size:12px;line-height:1.4}
.rule.ok{border-color:var(--ok);background:#edf8f3}.rule.warn{border-color:#ce8a24;background:#fff7e7}.rule.red{border-color:var(--danger);background:#fff0f0}
.statusline{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.statusline:last-child{border:0}
.statusline b{font-size:12px}.yes{color:var(--ok);font-weight:900}.no{color:var(--warn);font-weight:900}
.imagebox{background:#eef1f3;border:1px solid #dce2e5;border-radius:16px;min-height:180px;display:grid;place-items:center;overflow:hidden;position:relative}
.imagebox img{width:100%;height:auto;display:block}
.imagebox .loading{padding:25px;text-align:center;color:var(--muted);font-size:12px}
.variants{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.variant{border:2px solid transparent;background:#eef1f3;border-radius:13px;overflow:hidden;min-height:110px;position:relative}
.variant.selected{border-color:var(--ok)}
.variant img{width:100%;height:100%;object-fit:cover;display:block}
.variant button{position:absolute;left:5px;right:5px;bottom:5px;border:0;border-radius:9px;background:#ffffffed;padding:7px 4px;font-size:10px;font-weight:850;color:var(--navy)}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fffdf9ee;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:6px 3px max(7px,env(safe-area-inset-bottom));z-index:40}
.bottomnav button{border:0;background:none;color:#606b74;font-size:10px;font-weight:800;padding:4px}.bottomnav button.active{color:var(--navy)}.bottomnav span{display:block;font-size:19px;margin-bottom:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:min(470px,calc(100% - 28px));z-index:100;border-radius:14px;padding:12px 13px;background:#1f3444;color:#fff;box-shadow:0 10px 30px #0003;font-size:12px;display:none}
.toast.show{display:block}.toast.err{background:#8f4545}.toast.ok{background:#176b52}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:25px 12px;color:var(--muted);font-size:12px}
.modal{position:fixed;inset:0;background:#13293b88;z-index:80;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--cream);border-radius:22px 22px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -15px 40px #0002}
pre.storytext{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.55;margin:0}
.hidden{display:none!important}

.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.order-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow)}
.order-card .next{margin-top:10px;border-top:1px solid #eee;padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:8px}.next b{font-size:11px;color:var(--navy)}
.contact{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.contact span,.contact a{font-size:10px;background:#f2f5f7;color:#526574;border-radius:999px;padding:5px 8px;text-decoration:none}
.workflow{display:flex;gap:4px;overflow:auto;margin:10px -2px 2px;padding:2px;scrollbar-width:none}.workflow::-webkit-scrollbar{display:none}.step{min-width:86px;padding:8px 7px;border-radius:12px;background:#f0f2f3;color:#6a747c;font-size:9px;font-weight:850;text-align:center}.step.done{background:#e7f4ee;color:var(--ok)}.step.now{background:var(--navy);color:#fff}.step.future{opacity:.6}
.nextbox{background:linear-gradient(145deg,#173957,#285978);color:#fff;border-radius:18px;padding:14px;margin-bottom:10px}.nextbox h3{font-size:16px;margin:0 0 4px}.nextbox p{font-size:11px;opacity:.82;margin:0}.nextbox .btn{background:#fff;color:var(--navy);margin-top:11px}
.story-quick{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;margin-bottom:7px}.story-quick .actions{grid-template-columns:1fr auto}.story-quick .mini-btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 10px;font-size:10px;font-weight:850}.story-quick .mini-btn.ok{background:#eaf6f1;color:var(--ok);border-color:#cbe6db}
.checks{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.check{font-size:9px;border-radius:999px;padding:4px 7px;background:#eef4f6;color:#527080}.check.ok{background:#e7f4ee;color:var(--ok)}.check.warn{background:#fff0d4;color:#87580d}
.print-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:9px}.print-card .btn{margin-top:10px}
.sectionlink{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:8px}.sectionlink b{font-size:13px;color:var(--navy)}.sectionlink span{font-size:11px;color:var(--muted)}

@media(min-width:700px){.app{margin-top:18px;margin-bottom:18px;min-height:calc(100vh - 36px);border-radius:26px;overflow:hidden}.bottomnav{bottom:18px;border-radius:0 0 26px 26px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="brandmark">S4K</div>
    <div><strong>Story4Kids</strong><small id="headerSub">Admin-Produktion</small></div>
    <div class="head-actions">
      <button class="iconbtn hidden" id="refreshBtn" title="Aktualisieren">↻</button>
      <button class="iconbtn hidden" id="logoutBtn" title="Abmelden">↪</button>
    </div>
  </div>
</header>
<main id="main"></main>
<nav class="bottomnav hidden" id="bottomnav">
  <button data-route="dashboard"><span>⌂</span>Aufträge</button>
  <button data-route="print"><span>▣</span>Druck</button>
  <button data-route="settings"><span>⚙</span>Einstellungen</button>
</nav>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const SB_URL='https://ctmtvaqryxgxbasaxbzw.supabase.co';
const PUB_KEY='sb_publishable_mzqLZKyWB37huJrnEtjveg_2c27yz29';

const S={
  session:null, requests:[], request:null, stories:[], characters:[], scenes:{}, variants:{}, readiness:null,
  imageUrls:new Map(), currentStory:null
};

const $=s=>document.querySelector(s);
const main=$('#main'), toastEl=$('#toast'), modal=$('#modal'), sheet=$('#sheet');

function esc(v=''){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function statusLabel(s){return ({planned:'offen',approved:'freigegeben',generating:'wird erzeugt',ready:'fertig',needs_review:'prüfen',failed:'Fehler',cancelled:'abgebrochen',draft:'Entwurf',reference_ready:'Referenz prüfen',review:'Varianten prüfen',selected:'ausgewählt',candidate:'Variante',rejected:'verworfen'})[s]||s||'—'}
function pillClass(s){return ['approved','ready','selected'].includes(s)?'ok':['failed','cancelled'].includes(s)?'red':['generating','reference_ready','review'].includes(s)?'blue':'warn'}
function prodStage(r){
  const m=r?.metadata||{}; if(m.production_stage)return m.production_stage;
  if(r?.status==='completed')return 'printed'; if(r?.status==='ready')return 'book_review'; if(r?.status==='generating')return 'ai'; if(r?.status==='in_review')return 'preparation'; return 'new';
}
const STAGES=['new','preparation','ai','book_review','print_ready','printing','printed'];
function stageLabel(s){return ({new:'Neu',preparation:'Vorbereitung',ai:'KI-Erstellung',book_review:'Buchprüfung',print_ready:'Druckbereit',printing:'Im Druck',printed:'Gedruckt'})[s]||s}
function stageClass(s){return ['printed','print_ready'].includes(s)?'ok':s==='printing'?'blue':s==='book_review'?'warn':''}
function contactInfo(r){
  const m=r?.metadata||{},c=m.contact||{};
  const instagram=c.instagram||c.instagram_name||m.instagram||m.instagram_name||m.instagram_handle||'';
  const preferred=c.preferred||c.preferred_channel||m.preferred_contact||'';
  return {email:r?.customer_email||c.email||'',phone:r?.customer_phone||c.phone||'',instagram,preferred};
}
function contactHtml(r){const c=contactInfo(r),a=[];if(c.instagram)a.push(`<span>◎ ${esc(c.instagram.replace(/^@/,''))}</span>`);if(c.phone)a.push(`<a href="tel:${esc(c.phone)}">☎ ${esc(c.phone)}</a>`);if(c.email)a.push(`<a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`);if(c.preferred)a.push(`<span>Bevorzugt: ${esc(c.preferred)}</span>`);return a.join('')||'<span>Kein Kontakt hinterlegt</span>'}
function nextAction(r){const s=prodStage(r);return ({new:'Auftrag prüfen',preparation:'Story-Ideen freigeben',ai:'KI-Erstellung prüfen',book_review:'Buch prüfen',print_ready:'Zum Druck geben',printing:'Druckstatus prüfen',printed:'Abgeschlossen'})[s]||'Öffnen'}
function stageIndex(s){return Math.max(0,STAGES.indexOf(s))}
function workflowHtml(r){const cur=stageIndex(prodStage(r));return `<div class="workflow">${STAGES.map((s,i)=>`<div class="step ${i<cur?'done':i===cur?'now':'future'}">${i<cur?'✓ ':''}${stageLabel(s)}</div>`).join('')}</div>`}

function toast(msg,type=''){toastEl.textContent=msg;toastEl.className='toast show '+type;clearTimeout(window._tt);window._tt=setTimeout(()=>toastEl.className='toast',4200)}
function busy(btn,on,label='Bitte warten …'){if(!btn)return; if(on){btn.dataset.old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'+esc(label)}else{btn.disabled=false;btn.innerHTML=btn.dataset.old||btn.innerHTML}}
function closeModal(){modal.classList.remove('open');sheet.innerHTML=''}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});

function saveSession(s){S.session=s;if(s)localStorage.setItem('s4k_session',JSON.stringify(s));else localStorage.removeItem('s4k_session')}
function loadStoredSession(){try{const x=JSON.parse(localStorage.getItem('s4k_session')||'null');if(x?.access_token)S.session=x}catch{}}
function jwtExp(token){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp||0}catch{return 0}}
async function refreshSession(){
  if(!S.session?.refresh_token)throw new Error('Keine Sitzung');
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:PUB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:S.session.refresh_token})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||'Sitzung abgelaufen');
  saveSession(d);return d;
}
async function token(){
  if(!S.session?.access_token)throw new Error('Nicht angemeldet');
  if(jwtExp(S.session.access_token)*1000-Date.now()<90000)await refreshSession();
  return S.session.access_token;
}
async function authFetch(url,opts={}){
  let t=await token();
  const headers={apikey:PUB_KEY,Authorization:'Bearer '+t,...(opts.headers||{})};
  let r=await fetch(url,{...opts,headers});
  if(r.status===401&&S.session?.refresh_token){await refreshSession();t=S.session.access_token;headers.Authorization='Bearer '+t;r=await fetch(url,{...opts,headers})}
  return r;
}
async function login(email,password){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:PUB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||d.error_description||'Login fehlgeschlagen');
  saveSession(d);
  const check=await rest('admin_access?select=user_id,is_active&is_active=eq.true&limit=1');
  if(!check.length){saveSession(null);throw new Error('Dieser Benutzer hat keinen aktiven Story4Kids-Adminzugriff.')}
  return d;
}
async function logout(){try{if(S.session)await authFetch(SB_URL+'/auth/v1/logout',{method:'POST'})}catch{}saveSession(null);location.hash='login';render()}
async function changePassword(password){
  const r=await authFetch(SB_URL+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.msg||d.message||'Passwort konnte nicht geändert werden');return d;
}
async function rest(path,opts={}){
  const r=await authFetch(SB_URL+'/rest/v1/'+path,{...opts,headers:{Accept:'application/json',...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});
  const txt=await r.text();let d=null;try{d=txt?JSON.parse(txt):null}catch{d=txt}
  if(!r.ok)throw new Error((d&&d.message)||('Datenbankfehler '+r.status));return d;
}
async function invoke(name,body){
  const r=await authFetch(SB_URL+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const txt=await r.text();let d={};try{d=txt?JSON.parse(txt):{}}catch{d={raw:txt}}
  if(!r.ok){const e=new Error(d.message||d.error||('Function '+r.status));e.data=d;e.status=r.status;throw e}return d;
}
async function privateImage(path){
  if(!path)return null;if(S.imageUrls.has(path))return S.imageUrls.get(path);
  const clean=path.split('/').map(encodeURIComponent).join('/');
  const r=await authFetch(SB_URL+'/storage/v1/object/authenticated/story-assets/'+clean);
  if(!r.ok)throw new Error('Privates Bild konnte nicht geladen werden');
  const u=URL.createObjectURL(await r.blob());S.imageUrls.set(path,u);return u;
}

async function loadRequests(){
  S.requests=await rest('customer_requests?select=id,status,customer_name,customer_email,customer_phone,child_first_name,child_age,language,theme,occasion,interests,story_wishes,moral_or_message,dedication,metadata,source,submitted_at,updated_at&order=submitted_at.desc&limit=50');
  if(S.request){const x=S.requests.find(r=>r.id===S.request.id);if(x)S.request=x}
}
async function loadRequest(id){
  const rows=await rest('customer_requests?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1');if(!rows.length)throw new Error('Auftrag nicht gefunden');
  S.request=rows[0];
  await Promise.all([loadStories(),loadCharacters()]);
}
async function loadStories(){if(!S.request)return;S.stories=await rest('customer_request_stories?select=*&request_id=eq.'+encodeURIComponent(S.request.id)+'&order=position.asc')}
async function loadCharacters(){if(!S.request)return;S.characters=await rest('customer_request_characters?select=*&request_id=eq.'+encodeURIComponent(S.request.id)+'&order=created_at.asc')}
async function loadScenes(storyId){S.scenes[storyId]=await rest('customer_request_story_scenes?select=*&request_story_id=eq.'+encodeURIComponent(storyId)+'&order=scene_index.asc');return S.scenes[storyId]}
async function loadVariants(sceneId){S.variants[sceneId]=await rest('story_image_variants?select=*&scene_id=eq.'+encodeURIComponent(sceneId)+'&order=variant_index.asc');return S.variants[sceneId]}
async function loadReadiness(){try{S.readiness=await invoke('story4kids-readiness',{})}catch(e){S.readiness={error:e.message}}}
async function updateProductionStage(requestId,stage){
  const r=S.requests.find(x=>x.id===requestId)||S.request;if(!r)throw new Error('Auftrag nicht gefunden');
  const metadata={...(r.metadata||{}),production_stage:stage,production_stage_updated_at:new Date().toISOString()};
  if(stage==='printed')metadata.printed_at=new Date().toISOString();
  await rest('customer_requests?id=eq.'+encodeURIComponent(requestId),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({metadata})});
  await loadRequests();if(S.request?.id===requestId)await loadRequest(requestId);
}
function activeNav(name){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===name))}


function route(){return (location.hash||'#login').slice(1).split('?')[0]}
function query(){return new URLSearchParams((location.hash.split('?')[1]||''))}
function go(r,params={}){const q=new URLSearchParams(params).toString();location.hash=r+(q?'?'+q:'')}
function shell(on=true){$('#bottomnav').classList.toggle('hidden',!on);$('#refreshBtn').classList.toggle('hidden',!on);$('#logoutBtn').classList.toggle('hidden',!on)}

function loginView(){
  shell(false);$('#headerSub').textContent='Sicherer Admin-Login';
  main.innerHTML=`<div class="hero">
    <span class="pill ok">LIVE · Story4Kids Backend</span>
    <h1>Admin-Produktion</h1>
    <p>Ein Auftrag nach dem anderen – von der Kundenanfrage bis zum gedruckten Buch.</p>
  </div>
  <div class="card">

function renderStoryActions(s){
  let h='',aiReady=!!S.readiness?.openai_api_key_configured&&!!S.readiness?.openai_zdr_confirmed;
  if(s.status==='planned'){
    h+=`<button class="btn ok" id="approveStory">Idee freigeben</button><button class="btn secondary" id="replaceStory">Idee ersetzen</button>`;
  }else if(s.status==='failed'&&s.approved_at){
    h+=`<div class="rule red"><b>KI-Erstellung fehlgeschlagen.</b><br>${esc(s.generation_error?.provider?.error||'Bitte Systemstatus prüfen.')}</div>`;
    h+=aiReady?`<button class="btn" id="generateStory">Geschichte erneut erzeugen</button>`:`<div class="rule warn"><b>KI noch nicht eingerichtet.</b> OpenAI API-Key und ZDR müssen bereit sein, bevor du erneut startest.</div><button class="btn" disabled>Geschichte erzeugen</button>`;
    h+=`<button class="btn secondary" id="replaceStory">Story-Idee ändern</button>`;
  }else if(s.status==='approved'){
    h+=aiReady?`<button class="btn" id="generateStory">800-Wörter-Geschichte erzeugen</button>`:`<div class="rule warn"><b>KI noch nicht eingerichtet.</b> Sobald OpenAI bereit ist, wird dieser Knopf freigeschaltet.</div><button class="btn" disabled>800-Wörter-Geschichte erzeugen</button>`;
    h+=`<div class="actions"><button class="btn secondary" id="replaceStory">Idee ersetzen</button><button class="btn danger" id="reopenStory">Freigabe zurücknehmen</button></div>`;
  }else if(s.status==='generating')h+=`<div class="rule warn">Die Geschichte wird gerade erzeugt. Danach bitte aktualisieren.</div>`;
  else if(s.status==='ready')h+=`<button class="btn" id="openScenes">Illustrationen bearbeiten</button>`;
  $('#storyActions').innerHTML=h;
  if($('#approveStory'))$('#approveStory').onclick=()=>storyAction('approve',s);
  if($('#reopenStory'))$('#reopenStory').onclick=()=>storyAction('reopen',s);
  if($('#generateStory'))$('#generateStory').onclick=e=>generateStory(s,e.currentTarget);
  if($('#replaceStory'))$('#replaceStory').onclick=()=>replaceStorySheet(s);
  if($('#openScenes'))$('#openScenes').onclick=()=>go('scenes',{story:s.id,request:S.request.id});
}

    for(const x of v){
      const d=document.createElement('div');d.className='variant '+(x.status==='selected'?'selected':'');d.innerHTML=`<div class="loading mini">Bild …</div>${x.status!=='selected'?`<button data-select="${x.id}">Verwenden</button>`:'<button disabled>✓ ausgewählt</button>'}`;vr.appendChild(d);
      privateImage(x.storage_path).then(u=>{if(u)d.insertAdjacentHTML('afterbegin',`<img alt="Variante ${x.variant_index}" src="${u}">`);d.querySelector('.loading')?.remove()}).catch(()=>{d.querySelector('.loading').textContent='Bild nicht ladbar'});
    }
  }
  document.querySelectorAll('[data-vargen]').forEach(b=>b.onclick=()=>generateVariants(b.dataset.vargen,b.dataset.regen==='1',b));
  document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>selectVariant(b.dataset.select,b));
}
async function generateVariants(sceneId,regenerate,b){
  try{busy(b,true,'3 Bilder werden erzeugt …');await invoke('generate-story-image-variants',{scene_id:sceneId,variant_count:3,regenerate});toast('Bildvarianten sind da.','ok');await scenesView()}catch(e){toast((e.data?.next_action?e.message+' · '+e.data.next_action:e.message),'err')}finally{busy(b,false)}
}
async function selectVariant(id,b){
  try{busy(b,true,'Auswählen …');await invoke('select-story-image-variant',{variant_id:id});toast('Bild ausgewählt.','ok');await scenesView()}catch(e){toast(e.message,'err')}finally{busy(b,false)}
}

function printView(){
  shell(true);activeNav('print');$('#headerSub').textContent='Druck';
  const items=S.requests.filter(r=>['print_ready','printing','printed'].includes(prodStage(r)));
  main.innerHTML=`<div class="row"><div><h2 style="margin-bottom:2px">Druck</h2><div class="small">Hier sind nur Bücher, die wirklich beim Druckprozess sind.</div></div><span class="pill">${items.length}</span></div>
  ${items.length?items.map(r=>{const s=prodStage(r);return `<div class="print-card"><div class="row"><div><div class="story-title">${esc(r.child_first_name)} · ${esc(r.customer_name)}</div><div class="contact">${contactHtml(r)}</div></div><span class="pill ${stageClass(s)}">${stageLabel(s)}</span></div>
  ${s==='print_ready'?`<button class="btn" data-stage="printing" data-rid="${r.id}">Als „Im Druck“ markieren</button>`:s==='printing'?`<button class="btn ok" data-stage="printed" data-rid="${r.id}">✓ Gedruckt – Auftrag abschließen</button>`:''}<button class="btn secondary" data-openreq="${r.id}">Auftrag öffnen</button></div>`}).join(''):'<div class="empty">Noch kein Buch ist im Druckbereich.</div>'}`;
  document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{try{busy(b,true);await updateProductionStage(b.dataset.rid,b.dataset.stage);toast('Druckstatus aktualisiert.','ok');printView()}catch(e){toast(e.message,'err')}finally{busy(b,false)}});
  document.querySelectorAll('[data-openreq]').forEach(b=>b.onclick=()=>go('request',{id:b.dataset.openreq}));
}
async function settingsView(){
  shell(true);activeNav('settings');$('#headerSub').textContent='Einstellungen';if(!S.readiness)await loadReadiness();
  const x=S.readiness||{}, f=x.test_fixture||{};
  main.innerHTML=`<h2>Einstellungen</h2>
  <div class="section-title">KI & System</div><div class="card">
   ${statusLine('Angemeldet',!!S.session)}${statusLine('Admin-Zugriff',x.admin_access!==false)}${statusLine('OpenAI API-Key',!!x.openai_api_key_configured)}${statusLine('Zero Data Retention',!!x.openai_zdr_confirmed)}
  </div>
  ${!x.openai_api_key_configured?'<div class="rule warn"><b>KI-Erstellung ist derzeit gesperrt.</b><br>Der OpenAI API-Key fehlt noch. Story-Freigaben funktionieren trotzdem.</div>':''}
  <div class="card kv"><b>Story-Modell</b><span>${esc(x.story_model||'—')}</span><b>Bild-Modell</b><span>${esc(x.image_model||'—')}</span><b>Testauftrag</b><span>${f.present?'vorhanden':'—'}</span></div>
  <div class="section-title">Passwort</div><div class="card"><label>Neues Passwort</label><input type="password" id="newPass" minlength="10" placeholder="mindestens 10 Zeichen"><label>Noch einmal</label><input type="password" id="newPass2" minlength="10"><button class="btn" id="changePass">Passwort ändern</button></div>`;
  $('#changePass').onclick=async e=>{const a=$('#newPass').value,b=$('#newPass2').value;if(a.length<10)return toast('Bitte mindestens 10 Zeichen.','err');if(a!==b)return toast('Passwörter stimmen nicht überein.','err');try{busy(e.currentTarget,true);await changePassword(a);$('#newPass').value='';$('#newPass2').value='';toast('Passwort geändert.','ok')}catch(err){toast(err.message,'err')}finally{busy(e.currentTarget,false)}}
}
function statusLine(name,ok){return `<div class="statusline"><b>${esc(name)}</b><span class="${ok?'yes':'no'}">${ok?'✓ bereit':'✕ fehlt'}</span></div>`}

async function render(){
  const r=route();
  if(!S.session&&r!=='login'){go('login');return}
  try{
    if(r==='login')return loginView();
    if(!S.requests.length)await loadRequests();
    if(r==='dashboard')return dashboardView();
    if(r==='print')return printView();
    if(r==='settings')return settingsView();
    if(r==='request'){const id=query().get('id');if(!S.request||S.request.id!==id)await loadRequest(id);return requestView()}
    if(!S.request&&S.requests.length)await loadRequest(S.requests[0].id);
    if(r==='production'){const rid=query().get('id');if(rid&&(!S.request||S.request.id!==rid))await loadRequest(rid);else await loadStories();return productionView()}
    if(r==='story'){const rid=query().get('request');if(rid&&(!S.request||S.request.id!==rid))await loadRequest(rid);else await loadStories();return storyView()}
    if(r==='characters'){const rid=query().get('id');if(rid&&(!S.request||S.request.id!==rid))await loadRequest(rid);else await loadCharacters();return charactersView()}
    if(r==='scenes'){const rid=query().get('request');if(rid&&(!S.request||S.request.id!==rid))await loadRequest(rid);else await loadStories();return scenesView()}
    if(r==='status')return settingsView();
    go('dashboard');
  }catch(e){main.innerHTML=`<div class="hero"><h2>Fehler</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Neu laden</button></div>`;toast(e.message,'err')}
}
window.addEventListener('hashchange',render);
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));
$('#logoutBtn').onclick=logout;
$('#refreshBtn').onclick=async()=>{try{await loadRequests();if(S.request)await loadRequest(S.request.id);S.readiness=null;await render();toast('Aktualisiert.','ok')}catch(e){toast(e.message,'err')}};

loadStoredSession();
if(!location.hash)location.hash=S.session?'dashboard':'login';
render();
</script>
</body>
</html>
